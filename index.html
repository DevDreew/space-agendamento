<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Space · Agendamento</title>
<meta name="description" content="Agende seu corte e barba pelo celular, sem cadastro.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Space">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* Direção: quadro de preços de barbearia em preto, com a comanda branca como peça central e o dourado só no que pede ação. */
:root{
  color-scheme:dark;
  --preto:#0b0b0c;--carvao:#161617;--grafite:#232325;--linha:#37342d;
  --branco:#f7f5f0;--cinza:#aca89e;
  --ouro:#d4ab5f;--ouro-claro:#efd59f;--ouro-apagado:#6e5a35;--sobre-ouro:#14110a;
  --papel:#fbf8f1;--tinta:#151515;--tinta-2:#5d584e;
  --ok:#7ed7a4;--espera:#f4c95d;--ruim:#f39488;--neutro:#b5b1a8;
  --titulo:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --texto:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:10px;--poste:repeating-linear-gradient(-45deg,var(--ouro) 0 9px,var(--branco) 9px 18px,var(--preto) 18px 27px);
  --topo:env(safe-area-inset-top,0px);--base:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html{background:var(--preto);-webkit-text-size-adjust:100%}
body{background:var(--preto);color:var(--branco);font:400 16px/1.5 var(--texto);min-height:100%;padding-top:var(--topo)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed}
a{color:inherit}
h1,h2,h3{font-family:var(--titulo);font-weight:800;line-height:1.02;text-wrap:balance;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--ouro-claro);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pole{height:6px;background:var(--poste)}
.aviso{font-size:13px;color:var(--cinza);padding:8px 16px;border-bottom:1px solid var(--linha);text-align:center}
.aviso.erro{color:var(--ruim)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r);background:var(--ouro);color:var(--sobre-ouro);font-weight:700;transition:transform .15s ease-out,background .15s ease-out;text-decoration:none;text-align:center}
.btn:hover{background:var(--ouro-claro)}.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--grafite);color:var(--cinza)}
.btn.sec{background:none;border:1px solid var(--linha);color:var(--branco)}.btn.sec:hover{border-color:var(--ouro);background:none}
.btn.peq{min-height:44px;padding:0 14px;font-size:14px}
.btn.larga{width:100%}
.btn.perigo{background:none;border:1px solid #7a4039;color:var(--ruim)}.btn.perigo:hover{border-color:var(--ruim);background:none}
.link{color:var(--ouro-claro);text-decoration:underline;text-underline-offset:3px;font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:6px}

/* app do cliente */
.cli{min-height:100vh;display:grid;grid-template-columns:1fr;padding-bottom:calc(76px + var(--base))}
.marca{padding:22px 18px 18px;border-bottom:1px solid var(--linha)}
.marca small{display:flex;align-items:center;gap:8px;color:var(--cinza);font-size:14px}
.marca h1{font-size:clamp(42px,14vw,84px);overflow-wrap:anywhere;font-weight:900;text-transform:uppercase;color:var(--branco);margin:6px 0 10px}
.marca h1 span{color:var(--ouro)}
.marca .info{display:grid;gap:4px;color:var(--cinza);font-size:14px}
.marca .info div{display:flex;gap:8px;align-items:center}.marca svg.i{width:16px;height:16px}
.aberto{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.aberto.sim{color:var(--ok)}.aberto.nao{color:var(--ruim)}
.fluxo{padding:18px;max-width:640px;width:100%;margin:0 auto}
.rapido{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--ouro);border-radius:var(--r);padding:14px 16px;margin-bottom:22px;background:var(--carvao);transition:background .15s ease-out}
.rapido:hover{background:var(--grafite)}
.rapido small{color:var(--cinza);font-size:13px;display:block}
.rapido b{font:800 30px/1.05 var(--titulo);display:block}
.rapido em{font-style:normal;color:var(--ouro-claro);font-size:14px}
.rapido svg{color:var(--ouro)}
.h-etapa{font-size:40px;text-transform:uppercase;margin-bottom:4px}
.sub{color:var(--cinza);font-size:15px;margin-bottom:16px}
.tabela{display:grid}
.item{display:grid;grid-template-columns:1fr;gap:2px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--linha);min-height:64px;transition:padding .15s ease-out,background .15s ease-out}
.item:hover{background:var(--carvao);padding-left:10px;padding-right:10px}
.item .ln{display:flex;align-items:baseline;gap:8px}
.item .nm{font:800 27px/1.05 var(--titulo);text-transform:uppercase}
.item .dots{flex:1;border-bottom:2px dotted var(--ouro-apagado);transform:translateY(-5px);min-width:16px}
.item .pr{font:800 27px/1 var(--titulo);color:var(--ouro);white-space:nowrap}
.item small{color:var(--cinza);font-size:14px}
.item.on{background:var(--carvao);padding-left:10px;padding-right:10px;box-shadow:inset 3px 0 var(--ouro)}
.trilho{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pedaco{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--linha);border-radius:99px;font-size:14px;color:var(--branco)}
.pedaco:hover{border-color:var(--ouro)}.pedaco svg{width:14px;height:14px;color:var(--ouro)}
.voltar{display:inline-flex;align-items:center;gap:4px;color:var(--cinza);min-height:44px;font-size:14px}
.voltar:hover{color:var(--branco)}
.rotulo{font-size:13px;font-weight:600;color:var(--cinza);margin:18px 0 8px}
.barbeiros{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -2px}
.barbeiros::-webkit-scrollbar,.dias::-webkit-scrollbar{display:none}
.bb{flex:none;display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 14px 6px 6px;border:1px solid var(--linha);border-radius:99px;font-size:15px;font-weight:600}
.bb .av{width:38px;height:38px;border-radius:50%;background:var(--grafite);color:var(--ouro-claro);display:grid;place-items:center;font:800 20px var(--titulo)}
.bb.on{border-color:var(--ouro);background:var(--ouro);color:var(--sobre-ouro)}.bb.on .av{background:var(--sobre-ouro)}
.dias{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -2px}
.dia{flex:none;width:60px;min-height:74px;border:1px solid var(--linha);border-radius:var(--r);display:grid;place-content:center;text-align:center;gap:0}
.dia small{font-size:12px;color:var(--cinza);text-transform:capitalize}
.dia b{font:800 28px/1 var(--titulo)}
.dia.on{background:var(--branco);color:var(--tinta);border-color:var(--branco)}.dia.on small{color:var(--tinta-2)}
.dia:disabled{opacity:.42}.dia:disabled b{text-decoration:line-through}
.periodo{font-size:13px;font-weight:600;color:var(--cinza);margin:16px 0 8px}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.hora{min-height:50px;border:1px solid var(--linha);border-radius:8px;font:800 23px var(--titulo);font-variant-numeric:tabular-nums;transition:border-color .15s ease-out,background .15s ease-out}
.hora:hover:not(:disabled){border-color:var(--ouro)}
.hora.on{background:var(--ouro);color:var(--sobre-ouro);border-color:var(--ouro)}
.hora:disabled{color:#77736a;border-style:dashed;text-decoration:line-through}
.dica{font-size:13px;color:var(--cinza);margin-top:12px}
.vazio{border:1px dashed var(--linha);border-radius:var(--r);padding:22px;text-align:center;color:var(--cinza);display:grid;gap:12px;justify-items:center}
.vazio h3{font-size:26px;color:var(--branco);text-transform:uppercase}

/* comanda */
.comanda{position:relative;background:var(--papel);color:var(--tinta);padding:20px 18px 26px;border-radius:6px 6px 0 0;--d:7px;
  -webkit-mask:radial-gradient(circle var(--d) at 50% 100%,#0000 98%,#000) 50% 100%/calc(var(--d)*3) 100% repeat-x;
  mask:radial-gradient(circle var(--d) at 50% 100%,#0000 98%,#000) 50% 100%/calc(var(--d)*3) 100% repeat-x;margin-bottom:16px}
.comanda::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--poste);border-radius:6px 6px 0 0}
.c-topo{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--tinta);padding:6px 0 8px;gap:12px}
.c-topo b{font:900 26px/1 var(--titulo);text-transform:uppercase}
.c-topo span{font-size:12px;color:var(--tinta-2);white-space:nowrap}
.c-l{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px dashed #cfc8b8;font-size:15px}
.c-l span{color:var(--tinta-2)}.c-l i{flex:1}.c-l b{font-weight:600;text-align:right}
.c-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px}
.c-total span{font-weight:600}.c-total b{font:900 40px/1 var(--titulo)}
.carimbo{transform:rotate(-4deg);border:3px solid;border-radius:6px;padding:2px 12px;font:900 26px/1.2 var(--titulo);letter-spacing:.04em;text-transform:uppercase;display:inline-flex;gap:6px;align-items:center;margin-top:14px}
.carimbo svg{width:18px;height:18px}
.carimbo.pendente{color:#8a5a00}.carimbo.confirmado{color:#14713f}.carimbo.recusado,.carimbo.cancelado{color:#a42c20}.carimbo.concluido{color:#3f3b33}.carimbo.nao-veio{color:#a42c20}
.campo{display:grid;gap:6px;margin-bottom:14px;font-size:14px;font-weight:500}
.campo input,.campo select,.campo textarea{width:100%;min-height:50px;padding:12px;background:var(--carvao);border:1px solid var(--linha);border-radius:8px;font-size:16px}
.campo textarea{min-height:76px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--ouro);outline:none}
.campo .ajuda{color:var(--cinza);font-size:13px;font-weight:400}
.campo .err{color:var(--ruim);font-size:13px;font-weight:500}
.seta{transition:transform .2s ease-out}.rapido:hover .seta{transform:translateX(3px)}
.etiqueta{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--linha);align-items:start}
.etiqueta .qdo{font:800 34px/1 var(--titulo);font-variant-numeric:tabular-nums;min-width:82px}
.etiqueta .qdo small{display:block;font:500 13px var(--texto);color:var(--cinza);text-transform:capitalize;margin-top:3px}
.etiqueta h3{font-size:24px;text-transform:uppercase}
.etiqueta p{color:var(--cinza);font-size:14px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;white-space:nowrap}
.pill svg{width:15px;height:15px}
.pill.pendente{color:var(--espera)}.pill.confirmado,.pill.concluido{color:var(--ok)}.pill.recusado,.pill.cancelado,.pill.nao-veio{color:var(--ruim)}.pill.bloqueado{color:var(--neutro)}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#101011f2;border-top:1px solid var(--linha);padding-bottom:var(--base);z-index:5}
.tabbar a,.tabbar button{flex:1;display:grid;justify-items:center;gap:2px;padding:10px 4px 9px;color:var(--cinza);font-size:12px;font-weight:600;text-decoration:none;position:relative;min-height:60px}
.tabbar .on{color:var(--ouro-claro)}
.badge{position:absolute;top:6px;left:calc(50% + 7px);min-width:18px;height:18px;border-radius:9px;background:var(--ouro);color:var(--sobre-ouro);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.titulo-sec{font-size:32px;text-transform:uppercase;margin:6px 0 2px}

/* painel do barbeiro */
.pro{min-height:100vh;padding-bottom:calc(76px + var(--base))}
.pro main{padding:18px;max-width:1120px;margin:0 auto}
.lado{display:none}
.topo-pro{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.topo-pro h1{font-size:44px;text-transform:uppercase}
.topo-pro small{color:var(--cinza);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.kpi{background:var(--carvao);border:1px solid var(--linha);border-radius:var(--r);padding:14px}
.kpi span{font-size:13px;color:var(--cinza);display:block}
.kpi b{font:800 38px/1.1 var(--titulo);display:block;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi em{font-style:normal;font-size:13px;color:var(--cinza);display:inline-flex;align-items:center;gap:4px}
.kpi em svg{width:14px;height:14px}.kpi em.sobe{color:var(--ok)}.kpi em.desce{color:var(--ruim)}
.kpi.alerta{border-color:var(--espera)}
.bloco{margin-bottom:26px}
.bloco>h2{font-size:28px;text-transform:uppercase;margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.bloco>h2 small{font:500 14px var(--texto);color:var(--cinza);text-transform:none}
.pedido{background:var(--carvao);border:1px solid var(--linha);border-left:3px solid var(--espera);border-radius:var(--r);padding:14px;display:grid;gap:10px;margin-bottom:10px}
.pedido .qdo{font:800 30px/1 var(--titulo);font-variant-numeric:tabular-nums}
.pedido .qdo small{font:500 14px var(--texto);color:var(--cinza);text-transform:capitalize;margin-left:6px}
.pedido p{font-size:15px}.pedido p span{color:var(--cinza)}
.pedido .acoes{margin:0}
.fila{display:grid}
.linha{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--linha);width:100%;text-align:left}
.linha:hover{background:var(--carvao)}
.linha b.t{font:800 25px var(--titulo);font-variant-numeric:tabular-nums}
.linha div b{font-weight:600}.linha div small{display:block;color:var(--cinza);font-size:14px}
.linha.prox{background:var(--carvao);box-shadow:inset 3px 0 var(--ouro)}
.linha.pass{opacity:.62}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--linha);border-radius:99px;font-size:14px;font-weight:600;color:var(--cinza)}
.chip.on{background:var(--branco);color:var(--tinta);border-color:var(--branco)}
.chip:hover:not(.on){color:var(--branco)}
.tempo-wrap{overflow-x:auto;border:1px solid var(--linha);border-radius:var(--r)}
.tempo{display:grid;min-width:100%;position:relative}
.cab{position:sticky;top:0;background:var(--carvao);padding:10px;font:800 21px var(--titulo);text-transform:uppercase;border-bottom:1px solid var(--linha);border-left:1px solid var(--linha);z-index:2}
.cab.hr{border-left:0}
.rail{position:relative;border-right:0}
.rail span{position:absolute;left:8px;font-size:12px;color:var(--cinza);font-variant-numeric:tabular-nums;transform:translateY(2px)}
.col{position:relative;border-left:1px solid var(--linha)}
.livre{position:absolute;left:4px;right:4px;border-radius:6px;color:#6f6b62;display:grid;place-items:center;border:1px dashed #2c2a26}
.livre:hover{border-color:var(--ouro);color:var(--ouro)}.livre svg{width:16px;height:16px}
.ev{position:absolute;left:4px;right:4px;border-radius:6px;padding:5px 8px;text-align:left;overflow:hidden;background:var(--grafite);border-left:3px solid var(--ok);font-size:13px;line-height:1.25}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev small{color:var(--cinza);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.pendente{border-left-color:var(--espera);background:#2a2415}
.ev.bloqueado{border-left-color:var(--neutro);background:repeating-linear-gradient(135deg,#232325 0 6px,#2b2b2e 6px 12px)}
.ev.concluido{opacity:.66}.ev.nao-veio{border-left-color:var(--ruim);opacity:.66}
.almoco{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,#17171800 0 7px,#26262a 7px 9px);display:grid;place-items:center;font-size:12px;color:var(--cinza)}
.agora{position:absolute;left:0;right:0;height:2px;background:var(--ruim);z-index:1}
.setas{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ic{width:44px;height:44px;border:1px solid var(--linha);border-radius:8px;display:grid;place-items:center}
.ic:hover{border-color:var(--ouro)}
.busca{position:relative;margin-bottom:12px}
.busca input{width:100%;min-height:48px;padding:0 12px 0 42px;background:var(--carvao);border:1px solid var(--linha);border-radius:8px}
.busca svg{position:absolute;left:12px;top:14px;color:var(--cinza)}
.cli-l{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--linha)}
.cli-l b{font-weight:600}.cli-l small{display:block;color:var(--cinza);font-size:14px}
.tag{font-size:12px;font-weight:700;color:var(--espera);margin-left:6px;white-space:nowrap}
.painel{background:var(--carvao);border:1px solid var(--linha);border-radius:var(--r);padding:16px}
.painel h3{font-size:24px;text-transform:uppercase}
.painel p.q{color:var(--cinza);font-size:14px;margin-bottom:14px}
.graf-grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.colunas{display:flex;align-items:flex-end;gap:10px;height:210px;border-bottom:1px solid var(--linha);padding-top:24px}
.colunas .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;border-radius:4px}
.colunas .v{font-size:12px;color:var(--branco);font-variant-numeric:tabular-nums;white-space:nowrap}
.colunas .b{width:min(100%,44px);background:var(--ouro-apagado);border-radius:4px 4px 0 0;min-height:2px}
.colunas .c.top .b{background:var(--ouro)}
.eixo{display:flex;gap:10px;margin-top:6px}.eixo span{flex:1;text-align:center;font-size:13px;color:var(--cinza)}
.barras{display:grid;gap:10px}
.barra{display:grid;grid-template-columns:minmax(0,104px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;border-radius:4px}
.barra .t{height:12px;background:var(--grafite);border-radius:0 4px 4px 0}.barra .t i{display:block;height:100%;background:var(--ouro);border-radius:0 4px 4px 0}
.barra span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra b{font-weight:600;font-variant-numeric:tabular-nums}
.leitura{border-left:3px solid var(--ouro);padding:4px 12px;margin-bottom:18px;font-size:16px}
#tip{position:fixed;z-index:30;background:var(--branco);color:var(--tinta);padding:6px 10px;border-radius:6px;font-size:13px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .15s ease-out;max-width:220px}
.aj{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.aj-l{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linha);width:100%;text-align:left}
.aj-l:hover b{color:var(--ouro-claro)}.aj-l small{display:block;color:var(--cinza);font-size:14px}
.hr-l{display:grid;grid-template-columns:76px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:6px 0}
.hr-l label.ck{display:flex;align-items:center;gap:8px;font-size:14px;min-height:44px}
.hr-l input[type=time]{width:100%;min-width:0;min-height:44px;padding:0 8px;background:var(--grafite);border:1px solid var(--linha);border-radius:8px}

dialog{background:var(--carvao);color:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:20px;width:min(460px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow:auto}
dialog::backdrop{background:#000b}
dialog h2{font-size:32px;text-transform:uppercase;margin-bottom:12px}
dialog .fim{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
dialog .fim>*{flex:1}
dialog .dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin-bottom:14px}
dialog .dl dt{color:var(--cinza)}dialog .dl dd{margin:0;text-align:right;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--base));transform:translate(-50%,12px);background:var(--branco);color:var(--tinta);padding:12px 16px;border-radius:8px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s ease-out,transform .2s ease-out;z-index:40;max-width:calc(100vw - 32px);width:max-content}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){
  .cli{grid-template-columns:400px 1fr;padding-bottom:0}
  .marca{position:sticky;top:0;height:100vh;border-bottom:0;border-right:1px solid var(--linha);padding:40px 32px;display:flex;flex-direction:column}
  .marca h1{font-size:92px}
  .marca .esp{flex:1}
  .fluxo{padding:40px 32px;max-width:680px;margin:0}
  .tabbar.c{position:static;grid-column:1;background:none;border:0;flex-direction:column;gap:2px;padding:0}
  .tabbar.c a,.tabbar.c button{display:flex;gap:10px;font-size:15px;justify-items:start;padding:8px 0;min-height:44px;align-items:center;flex:none}
  .tabbar.c .badge{position:static}
  #toast{bottom:28px}
  .pro{display:grid;grid-template-columns:232px 1fr;padding-bottom:0}
  .lado{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:26px 16px;border-right:1px solid var(--linha)}
  .lado h1{font-size:34px;text-transform:uppercase;margin-bottom:18px;padding:0 10px}
  .lado a{display:flex;gap:10px;align-items:center;min-height:46px;padding:0 10px;border-radius:8px;color:var(--cinza);text-decoration:none;font-weight:600;position:relative}
  .lado a:hover{color:var(--branco)}.lado a.on{background:var(--grafite);color:var(--ouro-claro)}
  .lado .badge{position:static;margin-left:auto}
  .lado .esp{flex:1}
  .pro .tabbar{display:none}
  .pro main{padding:32px;width:100%}
  .graf-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.graf-grid .wide{grid-column:1/-1}
  .aj{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pedidos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pedidos .pedido{margin:0}
}
@media(min-width:600px) and (max-width:899px){

  .marca .esp{display:none}.marca h1{font-size:64px;margin:4px 0 0;grid-column:1}.marca small{grid-column:1/-1}.marca .info{grid-column:2;grid-row:2;text-align:right;justify-items:end}

@media(min-width:900px){.pro main,.cli>main{min-width:0}}
.balcao .cli .tabbar{display:none}.balcao .cli{padding-bottom:var(--base)}

.amostra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;border:1px dashed var(--linha);border-radius:8px;margin-bottom:12px}

'use strict';

const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

const brl=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');
const dur=m=>m<60?m+' min':Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'');
const pad=n=>String(n).padStart(2,'0');
const K=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const D=k=>new Date(k+'T12:00:00');
const hoje=()=>K(new Date());
const agoraMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const soma=(k,n)=>{const d=D(k);d.setDate(d.getDate()+n);return K(d)};
const semana=k=>D(k).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
const dataCurta=k=>k==hoje()?'hoje':k==soma(hoje(),1)?'amanhã':D(k).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace('.','');
const dataLonga=k=>D(k).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
const dig=s=>String(s||'').replace(/\D/g,'');
const fone=s=>{const d=dig(s).slice(0,11);if(d.length<3)return d;if(d.length<7)return`(${d.slice(0,2)}) ${d.slice(2)}`;if(d.length<11)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`};

const SLUG=(()=>{const p=location.pathname.split('/').filter(Boolean)[0]||'';const v=decodeURIComponent(p).toLowerCase();return/^[a-z0-9-]{2,40}$/.test(v)&&v!='index.html'?v:'space'})();

/* ---------- dados de demonstração (só quando não há banco) ---------- */
const NOMES=[['Lucas Almeida','11987650101'],['Bruno Costa','11987650102'],['Matheus Rocha','11987650103'],['Gabriel Souza','11987650104'],['Pedro Martins','11987650105'],['João Ribeiro','11987650106'],['André Lima','11987650107'],['Felipe Nunes','11987650108'],['Thiago Reis','11987650109'],['Caio Freitas','11987650110']];
function makeExamples(c,opt){opt=opt||{};const a=opt.desde||-62,z=opt.ate||6,f=opt.f||1,lim=opt.pessoas||NOMES.length;
 let x=opt.seed||20261109;const rnd=()=>{x|=0;x=x+0x6D2B79F5|0;let t=Math.imul(x^x>>>15,1|x);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const fator={1:.22,2:.26,3:.3,4:.38,5:.6,6:.72};const t0=hoje(),now=agoraMin();const slots={},cli={};let pend=0;
 const pess=NOMES.slice(0,lim);
 pess.forEach(([n,p])=>{const o='ex-'+p;slots[o]={items:{}};cli[o]={me:{name:n+' (exemplo)',phone:p},items:{}}});
 const pesos=['corte','corte','corte','combo','combo','barba','sobrancelha','luzes'];
 for(let i=a;i<=z;i++){const k=soma(t0,i),h=c.hours[D(k).getDay()];if(!h)continue;
  for(const b of c.barbers){let s=h[0];while(s<h[1]){const lunch=c.lunch&&s<c.lunch[1]&&s+c.step>c.lunch[0];if(lunch){s=c.lunch[1];continue}
   if(rnd()<(fator[D(k).getDay()]*(i>0?.55:1)*f)){const esc1=pesos[rnd()*pesos.length|0],sv=c.services.find(v=>v.id==esc1)||c.services[0];
    if(s+sv.dur<=h[1]&&!(c.lunch&&s<c.lunch[1]&&s+sv.dur>c.lunch[0])){let st;const pass=i<0||(i==0&&s+sv.dur<now);
     if(pass)st=rnd()<.08?'nao-veio':'concluido';else if(i>=0&&pend<3&&rnd()<.3){st='pendente';pend++}else st='confirmado';
     const [,p]=pess[rnd()*pess.length|0],o='ex-'+p,id='e'+i.toString().replace('-','m')+b.id[0]+s;
     slots[o].items[id]={b:b.id,d:k,s,dur:sv.dur,svc:sv.id,n:sv.name,p:sv.price,st,at:Date.now()-(st=='pendente'?3600000*(1+rnd()*4):86400000)};
     s+=Math.ceil(sv.dur/c.step)*c.step;continue}}

 return{slots,cli}}

const Store={mode:'carregando',db:null,user:null,uid:null,admin:false,podeEscrever:true,ready:false,erro:'',cfg:PADRAO,slots:{},cli:{},
 _salvaLocal(){try{localStorage.setItem('barbearia-'+SLUG,JSON.stringify({cfg:this.cfg,slots:this.slots,cli:this.cli}))}catch(e){}},
 local(){this.mode='local';this.uid='cliente-demo';this.admin=true;this.ready=true;let d=null;try{d=JSON.parse(localStorage.getItem('barbearia-'+SLUG)||'null')}catch(e){}

 async conectar(){

  const pronto=s=>{if(!s.metadata||!s.metadata.fromCache){this.ready=true;clearTimeout(espera);this.erro=''}};
  const falha=e=>{this.erro=e&&e.code=='revoked'?'Seu acesso a esta agenda mudou.':'Não consegui atualizar a agenda agora.';this.ready=true;clearTimeout(espera);atualiza()};
  db.doc('config/shop').onSnapshot(s=>{if(s.exists)this.cfg=Object.assign({},PADRAO,s.data());atualiza()},falha);

 ir(v){vaPara(+v)},
 novo(){clearTimeout(U.tBalcao);reinicia();if(U.balcao){U.nome='';U.tel=''}vaPara(1)},
 rapido(){const n=proximoLivre();if(!n)return;U.rapido=n;U.date=n.k;U.time=n.s;U.barber=n.b.id;toast('Agora escolha o serviço para '+dataCurta(n.k)+', '+hm(n.s));vaPara(1)},
 svc(v){U.svc=v;const s=servico(v);if(U.rapido&&livresEm(U.date,U.time,s.dur,U.barber).length){U.rapido=null;return vaPara(3)}U.rapido=null;if(U.time!=null&&!livresEm(U.date,U.time,s.dur,U.barber).length)U.time=null;vaPara(2)},
 barber(v){U.barber=v;U.time=null;R(true)},
 dia(v){U.date=v;U.time=null;R(true)},
 hora(v){U.time=+v;vaPara(3)},
 proxdia(){const s=servico(U.svc);for(let i=1;i<21;i++){const k=soma(U.date,i);if(grade(k).some(t=>livresEm(k,t,s.dur,U.barber).length)){U.date=k;U.time=null;return R(true)}}toast('Sem vagas nas próximas semanas com essa escolha.')},
 repetir(v){reinicia();if(servico(v))U.svc=v;location.hash='agendar';U.step=servico(v)?2:1;R(true)},
 async 'cli-cancela'(v){const x=todos().find(i=>i.id==v&&i.o==Store.uid);if(!x)return;abre(`<h2>Cancelar horário?</h2><p class="dica" style="margin:0 0 14px">${esc(x.n)}, ${esc(dataCurta(x.d))} às ${hm(x.s)}. O horário volta a ficar livre.</p><div class="fim"><button class="btn perigo" data-a="cli-cancela2" data-v="${esc(v)}">Cancelar horário</button><button class="btn sec" data-a="fecha">Manter</button></div>`)},
 async 'cli-cancela2'(v){fecha();await mudaStatus(Store.uid,v,'cancelado');toast('Horário cancelado.')},
 pb(v){U.pb=v;R(true)},per(v){U.per=+v;R(true)},filtro(v){U.filtro=v;R(true)},
 ad(v){U.ad=soma(U.ad,+v);R(true)},adh(){U.ad=hoje();R(true)},adset(v){U.ad=v;R(true)},
 detalhe,manual(){dlgManual()},livre:dlgLivre,bloq:dlgBloq,
 'livre-marca'(v){const[b,k,s]=v.split('|');dlgManual(b,k,+s)},
 fecha,
 async aceitar(v){const[o,id]=v.split('|'),x=achar(v);if(!x)return;if(x.st!='pendente'){toast('Este pedido já foi respondido.');return fecha()}await mudaStatus(o,id,'confirmado');toast('Aceito. O cliente vê na hora.');avisar(x,'ok')},
 async recusar(v){const[o,id]=v.split('|'),x=achar(v);if(!x)return;await mudaStatus(o,id,'recusado');toast('Recusado. O horário voltou a ficar livre.');avisar(x,'no')},
 async st(v){const[o,id,st]=v.split('|');await mudaStatus(o,id,st);fecha();toast({concluido:'Atendimento registrado.','nao-veio':'Falta registrada.',cancelado:'Horário liberado.'}[st])},
 'ed-svc'(v){dlgSvc(v)},'ed-bar'(v){dlgBar(v)},
 async 'rm-svc'(v){const c=Object.assign({},C(),{services:C().services.filter(s=>s.id!=v)});if(!c.services.length)return toast('Deixe pelo menos um serviço.');await protege(()=>Store.salvaCfg(c));fecha();toast('Serviço removido.')},
 async 'rm-bar'(v){const c=Object.assign({},C(),{barbers:C().barbers.filter(s=>s.id!=v)});if(!c.barbers.length)return toast('Deixe pelo menos um barbeiro.');await protege(()=>Store.salvaCfg(c));fecha();toast('Barbeiro removido.')},
 async carregar(){toast('Carregando exemplos…');await protege(()=>Store.carregarExemplos());toast('Histórico de exemplo carregado.')},
 cor(v){U.corPrevia=v;U.sujo=true;R(true)},
 async copiar(){try{await navigator.clipboard.writeText(location.origin+'/'+SLUG);toast('Link copiado.')}catch(e){toast('Não consegui copiar. Selecione o endereço e copie.')}},
 limpar(){abre(`<h2>Apagar exemplos?</h2><p class="dica" style="margin:0 0 14px">Remove os clientes e horários fictícios. Pedidos reais continuam.</p><div class="fim"><button class="btn perigo" data-a="limpar2">Apagar</button><button class="btn sec" data-a="fecha">Manter</button></div>`)},
 async limpar2(){fecha();await protege(()=>Store.apagarExemplos());toast('Dados de exemplo apagados.')}
};
const FORMS={
 async pedir(f){const nome=f.nome.value.trim(),tel=dig(f.tel.value),obs=f.obs.value.trim(),e={};U.nome=nome;U.tel=tel;U.obs=obs;if(nome.length<2)e.nome='Escreva seu nome para o barbeiro saber quem chega.';if(tel.length<10||tel.length>11)e.tel='Use DDD e número, por exemplo (11) 91234-5678.';U.erros=e;if(e.nome||e.tel){R(true);return}
  const s=servico(U.svc),b=$('#b-pedir');if(b){b.disabled=true;b.textContent='Enviando…'}
  const volta=m=>{toast(m);U.time=null;vaPara(2)};
  const ok=await protege(async()=>{let cand=livresEm(U.date,U.time,s.dur,U.barber).sort((a,c)=>carga(a.id,U.date)-carga(c.id,U.date));if(!cand.length){volta('Esse horário acabou de ser pedido. Escolha outro.');return false}
   const alvo=cand[0];if(!(await Store.travar(alvo.id,U.date))){volta('Alguém está marcando esse barbeiro agora. Tente em instantes.');return false}
   await Store.fresco();if(!cabe(alvo.id,U.date,U.time,s.dur)){volta('Esse horário acabou de ser pedido. Escolha outro.');return false}
   const id=novoId();await Store.guardar(Store.uid,id,{b:alvo.id,d:U.date,s:U.time,dur:s.dur,svc:s.id,n:s.name,p:s.price,st:'pendente',at:Date.now()},{name:nome,phone:tel,note:obs},U.balcao?null:{name:nome,phone:tel});U.enviado=id;return true},'Não consegui enviar seu pedido. Tente de novo.');
  if(ok){vaPara(4);if(U.balcao){clearTimeout(U.tBalcao);U.tBalcao=setTimeout(()=>ACOES.novo(),25000)}}else if(b&&ok===false&&U.step==3){b.disabled=false;b.textContent='Pedir este horário'}},
 async manual(f){const nome=f.nome.value.trim(),tel=dig(f.tel.value),s=servico(f.svc.value),b=f.b.value,d=f.d.value,t=+f.s.value,err=$('#m-err');if(nome.length<2||tel.length<10){err.textContent='Informe nome e WhatsApp com DDD.';return}const h=horario(d);if(!h||!grade(d).includes(t)){err.textContent='Esse dia ou horário está fora do funcionamento.';return}if(t+s.dur>h[1]||ocupado(b,d).some(i=>t<i[1]&&t+s.dur>i[0])){err.textContent=`${barbeiro(b).name} já tem compromisso nesse horário.`;return}
  const key='m-'+tel;await protege(()=>Store.guardar(key,novoId(),{b,d,s:t,dur:s.dur,svc:s.id,n:s.name,p:s.price,st:'confirmado',at:Date.now()},{name:nome,phone:tel},{name:nome,phone:tel}));fecha();U.ad=d;toast('Horário marcado.')},
 async bloq(f){const[b,k,s]=f.v.value.split('|'),m=+f.dur.value,t=+s;if(ocupado(b,k).some(i=>t<i[1]&&t+m>i[0]))return toast('Já existe compromisso nesse intervalo. Escolha uma duração menor.');await protege(()=>Store.guardar('barbearia',novoId(),{b,d:k,s:t,dur:m,svc:'',n:f.n.value.trim()||'Bloqueado',p:0,st:'bloqueado',at:Date.now()}));fecha();toast('Horário bloqueado.')},
 async svc(f){const n=f.name.value.trim(),d=+f.dur.value,p=+f.price.value;if(!n||!d||p<0||f.price.value==='')return toast('Preencha nome, duração e preço.');const c=Object.assign({},C(),{services:C().services.slice()}),o={id:f.id.value||'s'+novoId(),name:n,desc:f.desc.value.trim(),dur:d,price:p},i=c.services.findIndex(x=>x.id==o.id);if(i>=0)c.services[i]=o;else c.services.push(o);await protege(()=>Store.salvaCfg(c));fecha();toast('Serviço salvo.')},
 async bar(f){const n=f.name.value.trim();if(!n)return toast('Informe o nome.');const c=Object.assign({},C(),{barbers:C().barbers.slice()}),o={id:f.id.value||'b'+novoId(),name:n,spec:f.spec.value.trim(),active:f.active.checked},i=c.barbers.findIndex(x=>x.id==o.id);if(i>=0)c.barbers[i]=o;else c.barbers.push(o);await protege(()=>Store.salvaCfg(c));fecha();toast('Barbeiro salvo.')},
 async horas(f){const hours={};for(const d of [0,1,2,3,4,5,6]){if(f['on'+d].checked){const o=toMin(f['o'+d].value),c=toMin(f['c'+d].value);if(!(o<c))return toast('O horário de abrir precisa ser antes do de fechar.');hours[d]=[o,c]}else hours[d]=null}let lunch=null;if(f.alm.checked){lunch=[toMin(f.alo.value),toMin(f.alc.value)];if(!(lunch[0]<lunch[1]))return toast('Confira o horário de almoço.')}const step=Math.max(10,+f.step.value||40);const c=Object.assign({},C(),{hours,lunch,step});U.sujo=false;await protege(()=>Store.salvaCfg(c));toast('Horários salvos.');R(true)},
 async casa(f){const name=f.name.value.trim();if(!name)return toast('Informe o nome da barbearia.');const c=Object.assign({},C(),{name,cor:f.cor.value,address:f.address.value.trim(),whatsapp:dig(f.whatsapp.value)});U.sujo=false;U.corPrevia=null;await protege(()=>Store.salvaCfg(c));toast('Dados salvos.');R(true)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(t.tagName=='A'&&a=='fecha'){fecha();return}if(ACOES[a]){e.preventDefault();ACOES[a](t.dataset.v)}});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(f&&FORMS[f]){e.preventDefault();FORMS[f](e.target)}});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='cor-livre'){U.corPrevia=t.value;U.sujo=true;aplicaCor(t.value);const h=document.querySelector('input[name=cor]');if(h)h.value=t.value;return}if(t.id=='busca'){U.q=t.value;$('#lista-cli').innerHTML=listaClientes()}else if(t.id=='f-tel'||t.id=='m-tel')t.value=fone(t.value);else if(U.rota=='ajustes'&&$('#app').contains(t))U.sujo=true;
 if(t.id=='m-d'){const sel=$('#m-s');sel.innerHTML=grade(t.value).map(s=>`<option value="${s}">${hm(s)}</option>`).join('')}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(adiado&&!editando())R()},0));
const tip=$('#tip');const mostra=e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.textContent=t.dataset.tip;const r=t.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-180,r.left+r.width/2-60))+'px';tip.style.top=Math.max(8,r.top-36)+'px';tip.style.opacity=1};
document.addEventListener('mouseover',mostra);document.addEventListener('focusin',mostra);
addEventListener('hashchange',rota);
setInterval(()=>{if(!dlg().open)R()},60000);
atualiza();rota();Store.conectar().then(rota);
</script></body></html>
